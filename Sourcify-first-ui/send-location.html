<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Real Location to Tracking Server</title>
</head>
<body>
  <h2>Send Real Location to Tracking Server</h2>
  <button id="startBtn">Start Sending Location</button>
  <pre id="log" style="background:#f0f0f0; padding:10px; border-radius:8px; height:200px; overflow:auto;"></pre>
  <script>
    const WEBSOCKET_URL = 'ws://localhost:3000';
    let ws = null;

    function connectWebSocket() {
      ws = new WebSocket(WEBSOCKET_URL);
      ws.onopen = () => {
        log('Connected to tracking server.');
        startSendingLocation();
      };
      ws.onclose = () => {
        log('WebSocket disconnected. Reconnecting in 3s...');
        setTimeout(connectWebSocket, 3000);
      };
      ws.onerror = (err) => {
        log('WebSocket error: ' + err.message);
      };
    }

    function log(msg) {
      const logDiv = document.getElementById('log');
      if (logDiv) {
        logDiv.textContent += msg + '\n';
      }
    }

    function startSendingLocation() {
      if (!navigator.geolocation) {
        log('Geolocation is not supported by your browser. Using Coimbatore as fallback.');
        sendCoimbatoreLocation();
        return;
      }
      setInterval(() => {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ lat: latitude, lng: longitude }));
              log(`Sent: lat=${latitude}, lng=${longitude}`);
            }
          },
          (err) => {
            log('Error getting location: ' + err.message + '. Using Coimbatore as fallback.');
            sendCoimbatoreLocation();
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
        );
      }, 5000); // Send every 5 seconds
    }

    function sendCoimbatoreLocation() {
      // Coimbatore coordinates
      const latitude = 11.0168;
      const longitude = 76.9558;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ lat: latitude, lng: longitude }));
        log(`Sent fallback: lat=${latitude}, lng=${longitude}`);
      }
    }

    document.getElementById('startBtn').onclick = () => {
      connectWebSocket();
      document.getElementById('startBtn').disabled = true;
    };
  </script>
</body>
</html>
