<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Goods Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; margin: 0; }
    .tracking-header { text-align: center; padding: 24px 0 8px; color: #0066cc; font-size: 2rem; font-weight: 700; }
    #map { width: 100%; height: 60vh; border-radius: 18px; box-shadow: 0 4px 24px #0066cc22; margin: 0 auto; max-width: 900px; }
    .info-card { max-width: 900px; margin: 24px auto; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px #0066cc22; padding: 18px 28px; font-size: 1.1rem; color: #004080; }
    .status-stepper { display: flex; justify-content: space-between; align-items: center; margin: 24px auto 0; max-width: 900px; }
    .step { flex: 1; text-align: center; position: relative; }
    .step:not(:last-child)::after { content: ''; position: absolute; top: 18px; right: -50%; width: 100%; height: 4px; background: #b6e0fe; z-index: 0; }
    .step.active .circle, .step.completed .circle { background: #00aaff; color: #fff; }
    .step.completed .circle { background: #28a745; }
    .circle { width: 36px; height: 36px; border-radius: 50%; background: #e0e0e0; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; margin-bottom: 6px; z-index: 1; position: relative; }
    .step-label { font-size: 0.98rem; color: #0066cc; font-weight: 600; }
    .eta-distance { margin-top: 10px; color: #0077b6; font-size: 1.08rem; }
    @media (max-width: 600px) { #map, .info-card, .status-stepper { max-width: 100%; border-radius: 0; } .info-card { padding: 12px; } }
  </style>
</head>
<body>
  <div class="tracking-header">Live Goods Tracking</div>
  <div class="status-stepper" id="statusStepper">
    <div class="step" id="step-picked">
      <div class="circle">1</div>
      <div class="step-label">Picked Up</div>
    </div>
    <div class="step" id="step-transit">
      <div class="circle">2</div>
      <div class="step-label">In Transit</div>
    </div>
    <div class="step" id="step-arriving">
      <div class="circle">3</div>
      <div class="step-label">Arriving Soon</div>
    </div>
    <div class="step" id="step-delivered">
      <div class="circle">4</div>
      <div class="step-label">Delivered</div>
    </div>
  </div>
  <div id="map"></div>
  <div class="info-card" id="statusInfo">
    <b>Status:</b> <span id="status">Waiting for location...</span>
    <div class="eta-distance" id="etaDistance"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    // Sample start and end locations
    const start = [11.0004, 76.9661]; // Coimbatore Railway Station
    const end = [11.0168, 76.9558];   // Brookefields Mall

    // Initialize map
    const map = L.map('map').setView(start, 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Draw route polyline
    const route = [start, end];
    const polyline = L.polyline(route, { color: '#00aaff', weight: 5, opacity: 0.7 }).addTo(map);
    map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

    // Markers
    const startMarker = L.marker(start, { title: 'Supplier', icon: L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', iconSize: [32, 32], iconAnchor: [16, 32] }) }).addTo(map).bindPopup('Supplier (Coimbatore Railway Station)');
    const endMarker = L.marker(end, { title: 'Customer', icon: L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', iconSize: [32, 32], iconAnchor: [16, 32] }) }).addTo(map).bindPopup('Customer (Brookefields Mall)');

    // Animated vehicle marker
    const vehicleIcon = L.divIcon({
      className: 'live-marker',
      html: '<div style="background-color: #28a745; width: 26px; height: 26px; border-radius: 50%; border: 4px solid white; box-shadow: 0 0 12px rgba(40, 167, 69, 0.5);"></div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });
    let liveMarker = L.marker(start, { icon: vehicleIcon }).addTo(map).bindPopup('Waiting for live location...').openPopup();

    // User location marker
    let userMarker = null;
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        const userLatLng = [pos.coords.latitude, pos.coords.longitude];
        userMarker = L.marker(userLatLng, {
          title: 'You are here',
          icon: L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/149/149060.png',
            iconSize: [30, 30],
            iconAnchor: [15, 30]
          })
        }).addTo(map).bindPopup('You are here').openPopup();
        // Fit map to show both user and vehicle
        const group = L.featureGroup([liveMarker, userMarker]);
        map.fitBounds(group.getBounds(), { padding: [40, 40] });
      }, function(err) {
        // User denied or error
      });
    }

    // WebSocket for live updates
    let ws = null;
    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:3000');
      ws.onopen = function() {
        document.getElementById('status').textContent = 'Connected. Waiting for location...';
      };
      ws.onmessage = async function(event) {
        const { lat, lng } = JSON.parse(event.data);
        animateMarkerTo(liveMarker, [lat, lng]);
        map.panTo([lat, lng]);
        const place = await getPlaceName(lat, lng);
        liveMarker.setPopupContent(`Goods Location<br>Lat: ${lat.toFixed(6)}<br>Lng: ${lng.toFixed(6)}<br><b>Place:</b> ${place}`);
        liveMarker.openPopup();
        updateStatusAndStepper([lat, lng]);
      };
      ws.onerror = function(err) {
        document.getElementById('status').textContent = 'Connection error. Please try again.';
      };
      ws.onclose = function() {
        document.getElementById('status').textContent = 'Disconnected. Reconnecting...';
        setTimeout(connectWebSocket, 3000);
      };
    }
    connectWebSocket();

    // Animate marker movement
    function animateMarkerTo(marker, newLatLng) {
      const duration = 1000; // ms
      const frames = 20;
      const startLatLng = marker.getLatLng();
      let frame = 0;
      function animate() {
        frame++;
        const lat = startLatLng.lat + (newLatLng[0] - startLatLng.lat) * (frame / frames);
        const lng = startLatLng.lng + (newLatLng[1] - startLatLng.lng) * (frame / frames);
        marker.setLatLng([lat, lng]);
        if (frame < frames) {
          setTimeout(animate, duration / frames);
        } else {
          marker.setLatLng(newLatLng);
        }
      }
      animate();
    }

    // Reverse geocoding to get place name
    async function getPlaceName(lat, lng) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        if (!res.ok) return 'Unknown Place';
        const data = await res.json();
        if (data.address && (data.address.city || data.address.town || data.address.village)) {
          return data.address.city || data.address.town || data.address.village;
        }
        if (data.display_name) return data.display_name.split(',')[0];
        return 'Unknown Place';
      } catch {
        return 'Unknown Place';
      }
    }

    // Haversine formula for distance (km)
    function getDistanceKm([lat1, lng1], [lat2, lng2]) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Estimate ETA (assume avg speed 30km/h)
    function getETA(distanceKm) {
      const speed = 30; // km/h
      const etaMinutes = Math.round((distanceKm / speed) * 60);
      return etaMinutes <= 1 ? 'Arriving now' : `${etaMinutes} min`;
    }

    // Status stepper logic
    function updateStatusAndStepper(current) {
      const distToEnd = getDistanceKm(current, end);
      let status = '';
      let step = 1;
      if (distToEnd > 2) {
        status = 'Order Picked Up'; step = 1;
      } else if (distToEnd > 0.5) {
        status = 'In Transit'; step = 2;
      } else if (distToEnd > 0.1) {
        status = 'Arriving Soon'; step = 3;
      } else {
        status = 'Delivered'; step = 4;
      }
      document.getElementById('status').textContent = status;
      // Stepper UI
      ['picked','transit','arriving','delivered'].forEach((s, i) => {
        const el = document.getElementById('step-' + s);
        el.classList.remove('active','completed');
        if (i+1 < step) el.classList.add('completed');
        else if (i+1 === step) el.classList.add('active');
      });
      // ETA and distance
      const eta = getETA(distToEnd);
      document.getElementById('etaDistance').textContent = `ETA: ${eta} | Distance: ${distToEnd.toFixed(2)} km`;
    }
  </script>
</body>
</html>
